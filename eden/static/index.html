<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0f1a1c">
  <title>EDEN VIDEO</title>
  <meta name="description" content="EDEN VIDEO is a professional video editing app. Upload footage and get a finished edit for Instagram, TikTok, Facebook and YouTube.">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div class="shell">
    <aside class="rail" aria-label="Main">
      <a class="brand" href="#/" aria-label="EDEN VIDEO home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M13 10.5v11l9-5.5z" fill="var(--amber)"/>
          <path d="M5.5 25.5 26.5 6.5" stroke="var(--bg)" stroke-width="3"/>
        </svg>
        <span class="brand-text"><strong>EDEN</strong> VIDEO</span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="rail-foot" id="railFoot"></div>
    </aside>
    <main class="main-col"><div id="setupBanner" class="setup-banner" role="alert" hidden></div>
    <div id="view" class="view" tabindex="-1" aria-live="polite"></div></main>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="/static/js/app.js"></script>

</html>
