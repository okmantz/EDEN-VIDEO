<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0c11">
  <title>EDEN VIDEO</title>
  <meta name="description" content="EDEN VIDEO edits your videos for you: cuts pauses, adds captions, music and b-roll, in your brand.">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/inter_semibold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/styles.css">
  <script>try{var t=localStorage.getItem('eden.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div class="shell">
    <aside class="rail" aria-label="Main">
      <a class="brand" href="#/" aria-label="EDEN VIDEO home">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg></span>
        <span class="brand-text">EDEN VIDEO<small>Your edit, done for you</small></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <a class="rail-brandcard" id="railBrand" href="#/brand"></a>
      <div class="rail-foot" id="railFoot"></div>
    </aside>
    <main class="main-col"><div id="setupBanner" class="setup-banner" role="alert" hidden></div>
    <div id="view" class="view" tabindex="-1" aria-live="polite"></div></main>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
