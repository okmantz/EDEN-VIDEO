services:
  eden:
    build: .
    image: eden-video:latest
    restart: unless-stopped
    ports:
      # Bound to this computer only. Change to "8000:8000" to share on your network,
      # and set EDEN_PASSWORD in .env if you do.
      - "127.0.0.1:8000:8000"
    environment:
      EDEN_PASSWORD: ${EDEN_PASSWORD:-}
      EDEN_WHISPER_MODEL: ${EDEN_WHISPER_MODEL:-base}
      EDEN_MAX_UPLOAD_MB: ${EDEN_MAX_UPLOAD_MB:-4096}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      # Ollama running on the host machine (optional). On Linux, host.docker.internal needs the extra_hosts line below.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - eden-data:/data

volumes:
  eden-data:
